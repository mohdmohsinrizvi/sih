  - source_id: "openweather_api"
    source_name: "OpenWeatherMap"
    source_type: "api"
    url: "https://api.openweathermap.org/data/2.5"
    connector_type: "rest_api"
    authentication_required: true
    poll_interval_seconds: 600
    reliability: 0.9
    geographic_coverage: "Global"
    rate_limits: "1000 calls/day free tier"
    enabled: false
    legal_notes: "Free tier available. Requires API key."
    update_frequency: "hourly"
    description: "OpenWeatherMap API. Requires free API key."

  - source_id: "noaa_dataset"
    source_name: "NOAA Global Historical Data"
    source_type: "dataset"
