    connector_type: "csv"
    authentication_required: false
    poll_interval_seconds: 86400
    reliability: 0.95
    geographic_coverage: "Global"
    rate_limits: null
    enabled: true
    legal_notes: "Public domain data"
    update_frequency: "daily"
    description: "NOAA historical weather datasets"

  - source_id: "india_wiki_feeds"
    source_name: "Wikipedia Weather Feeds"
