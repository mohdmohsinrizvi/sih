  - source_id: "imd_api"
    source_name: "India Meteorological Department"
    source_type: "api"
    url: "https://api.imd.gov.in"
    connector_type: "rest_api"
    authentication_required: true
    poll_interval_seconds: 300
    reliability: 0.95
    geographic_coverage: "India"
