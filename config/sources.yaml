    source_name: "Citizen Weather Reports"
    source_type: "citizen"
    url: null
    connector_type: "citizen"
    authentication_required: false
    poll_interval_seconds: 0
    reliability: 0.6
    geographic_coverage: "India"
    rate_limits: null
