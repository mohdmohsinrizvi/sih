[project]
name = "weather-bigdata-platform"
version = "0.1.0"
description = "National Weather Big Data Analytics Platform - SIH Problem Statement 26069"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "geoalchemy2>=0.17.0",
    "pgvector>=0.3.0",
    "h3>=4.0.0",
    "redis[hiredis]>=5.2.0",
    "minio>=7.2.0",
    "confluent-kafka>=2.5.0",
    "httpx>=0.28.0",
    "aiohttp>=3.10.0",
    "polars>=1.12.0",
    "structlog>=24.4.0",
    "python-json-logger>=3.2.0",
    "prometheus-client>=0.21.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "orjson>=3.10.0",
    "pyjwt>=2.10.0",
    "click>=8.1.0",
    "rich>=13.9.0",
    "faker>=33.0.0",
    "numpy>=2.0.0",
    "hashlib-additional>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "black>=24.10.0",
]

[project.scripts]
weather = "cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schemas", "connectors", "data_engine", "streaming", "storage", "api", "cli", "pipeline", "synthetic", "replay_engine", "metrics", "config"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "PT", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
